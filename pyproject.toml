[tool.poetry]
name = "comparar_fundos_br"
version = "0.2.4"
description = "Obter dados de fundos de investimento"
authors = ["Rafael Rodrigues <rafael.rafarod@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/rafa-rod/comparar_fundos_br.git"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^3.0.5"
requests = "^2.34.2"
scipy = "^1.18.1"
matplotlib = "^3.11.1"
pyettj = "^0.4.1"
polars = "^1.44.0"
fastexcel = "^0.21.0"
certifi = "^2026.7.22"
urllib3 = "^2.7.0"
pillow = "^12.3.0"
lxml = "^6.1.2"
protobuf = "^7.36.0"
yfinance = "^1.6.0"
tesouro-direto-br = "^0.3.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"